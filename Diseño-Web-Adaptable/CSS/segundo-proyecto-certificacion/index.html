<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css"/>
  <title>Playing Cards</title>
</head>

<body>
  <main id="playing-cards">
    <div class="card ca">
      <div class="left ca"><div class="lc1n">A</div><div class="lca1">♠</div></div>
      <div class="middle ca">♠</div>
      <div class="right ca"><div class="lc1n">A</div><div class="rca1">♠</div></div>
    </div>

    <div class="card c2">
      <div class="left c2"><div class="lc2n">2</div><div class="lc21">♣</div></div>
      <div class="middle c2">
        <div class="mc21">♣</div>
        <div class="mc22">♣</div>
      </div>
      <div class="right c2"><div class="lc2n">2</div><div class="rc21">♣</div></div>
    </div>

    <div class="card c3">
      <div class="left c3"><div class="lc3n">3</div><div class="lc31">♥</div></div>
      <div class="middle c3">
        <div class="mc31">♥</div>
        <div class="mc32">♥</div>
        <div class="mc33">♥</div>
      </div>
      <div class="right c3"><div class="lc3n">3</div><div class="rc31">♥</div></div>
    </div>

    <div class="card c4">
      <div class="left c4"><div class="lc4n">4</div><div class="lc41">♦</div></div>
      <div class="middle c4">
        <div class="mc41">♦ ♦</div>
        <div class="mc42">♦ ♦</div>
      </div>
      <div class="right c4"><div class="lc4n">4</div><div class="rc41">♦</div></div>
    </div>

    <div class="card c5">
      <div class="left c5"><div class="lc5n">5</div><div class="lc51">♠</div></div>
      <div class="middle c5">
        <div class="mc51">♠ ♠</div>
        <div class="mc52">♠</div>
        <div class="mc53">♠ ♠</div>
      </div>
      <div class="right c5"><div class="lc5n">5</div><div class="rc51">♠</div></div>
    </div>

    <div class="card ck">
      <div class="left ck"><div class="lckn">K</div><div class="lcK1">♠</div></div>
      <div class="middle mck">
      </div>
      <div class="right ck"><div class="lckn">K</div><div class="rc51">♠</div></div>
    </div>

  </main>
</body>

</html>
