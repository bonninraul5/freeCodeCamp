<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
    <div class="form-container">
        <form>
            <h2>Contact Us</h2>
            <label for="name">Name: <input class="inline" id="name" name="name" type="text" required/></label>
            <label for="email">Email: <input class="inline" id="email" name="email" type="email" required/></label>
            <label for="message">Message: <textarea id="message" name="message" rows="3" cols="30" class="inline" required></textarea></label>
            <button type="submit">Submit</button>
        </form>
    </div>

</body>

</html>
